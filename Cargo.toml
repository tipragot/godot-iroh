[package]
name = "godot_iroh"
version = "0.1.6"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
godot = "0.5.5"
anyhow = "1.0.104"
bytes = "1.12.1"
base64 = "0.23.1"
