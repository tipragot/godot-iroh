[package]
name = "godot_iroh"
version = "0.1.5"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
iroh = { version = "1.2.0", default-features = false, features = ["tls-ring"] }
godot = "0.4.5"
anyhow = "1.0.100"
bytes = "1.11.0"
base64 = "0.22.1"
iroh-mdns-address-lookup = "0.5"
n0-future = "0.3.2"
